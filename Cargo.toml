[workspace]
members = ["packages/*", "packages/zk/vendor/lean-stwo-dummy"]
exclude = ["contracts", "packages/zk-vote-bridge"]

resolver = "2"

[workspace.package]
version = "4.0.0-zk"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0"
repository = "https://github.com/permissionlessweb/cosmwasm"

[workspace.dependencies]
cosmwasm-core = { path = "packages/core" }
cosmwasm-crypto = { path = "packages/crypto" }
cosmwasm-derive = { path = "packages/derive" }
cosmwasm-schema = { path = "packages/schema" }
cosmwasm-schema-derive = { path = "packages/schema-derive" }
cosmwasm-std = { path = "packages/std", default-features = false }
cosmwasm-vm = { path = "packages/vm" }
cosmwasm-vm-derive = { path = "packages/vm-derive" }
cw-schema = { path = "packages/cw-schema" }
cw-schema-derive = { path = "packages/cw-schema-derive" }
cosmwasm-check = { path = "packages/check" }
schemars = "0.8.4"
serde = { version = "1.0.192", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.140"
thiserror = "1.0.26"
zk-cosmwasm = { path = "packages/zk" }

# Local merge a960b174: upstream zakura-core/common main plus the artifact codec.
# Not pushed. A git rev of the fork tip 798a317 is still 1.3.0-alpha.1 and
# does not contain that merge. Version line is 5.0.0.
[patch.crates-io]
zakura-halo2-gadgets = { path = "../zakura-common/crates/halo2_gadgets" }
zakura-halo2-poseidon = { path = "../zakura-common/crates/halo2_poseidon" }
zakura-halo2-proofs = { path = "../zakura-common/crates/halo2_proofs" }
zakura-pasta-curves = { path = "../zakura-common/crates/pasta_curves" }
zakura-reddsa = { path = "../zakura-common/crates/reddsa" }
wasmer-compiler-singlepass = { git = "https://github.com/permissionlessweb/wasmer", rev = "e1edbf4ff55b0e0ccb61015ee1015d8283689fd5" }