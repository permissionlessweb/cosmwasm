[workspace]
members = ["packages/*", "packages/zk/vendor/lean-stwo-dummy"]
exclude = ["contracts", "packages/zk-vote-bridge"]

resolver = "2"

[workspace.package]
version = "4.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0"
repository = "https://github.com/permissionlessweb/cosmwasm"

[workspace.dependencies]
anyhow = "1"
ark-bls12-381 = "0.5.0"
ark-bn254 = { version = "0.5.0", default-features = false }
ark-crypto-primitives = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-groth16 = { version = "0.5.0", default-features = false }
ark-relations = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
assert_cmd = "2.1.2"
base64 = "0.22.0"
base64-serde = "0.7.0"
bech32 = "0.11.0"
bincode = "1.3"
blake2 = { version = "0.10.6", default-features = false }
blake2b_simd = { version = "1.0", default-features = false }
blake3 = { version = "1.5", default-features = false }
bnum = "0.11.0"
chrono = { version = "0.4", default-features = false }
clap = "4"
clru = "0.6.1"
colored = "2.1.0"
corez = "0.1.1"
cosmwasm-check = { path = "packages/check" }
cosmwasm-core = { path = "packages/core" }
cosmwasm-crypto = { path = "packages/crypto" }
cosmwasm-derive = { path = "packages/derive" }
cosmwasm-schema = { path = "packages/schema" }
cosmwasm-schema-derive = { path = "packages/schema-derive" }
cosmwasm-std = { path = "packages/std", default-features = false }
cosmwasm-vm = { path = "packages/vm" }
cosmwasm-vm-derive = { path = "packages/vm-derive" }
crc32fast = "1.3.2"
criterion = "0.5.1"
curve25519-dalek = "4.1.3"
cw-schema = { path = "packages/cw-schema" }
cw-schema-derive = { path = "packages/cw-schema-derive" }
derive_more = { version = "2.0.1", default-features = false }
derive_more1 = { package = "derive_more", version = "1.0.0", default-features = false }
dhat = "0.3.3"
digest = "0.10"
ecdsa = "0.16.8"
ed25519-zebra = { version = "=4.2.0", default-features = false }
english-numbers = "0.3"
flock-core = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
glob = "0.3.1"
group = "0.14"
halo2-axiom = { package = "halo2-axiom", git = "https://github.com/axiom-crypto/halo2", tag = "v0.5.1", default-features = false }
halo2-base = { package = "halo2-base", git = "https://github.com/axiom-crypto/halo2-lib", tag = "v0.4.1", default-features = false }
halo2_gadgets = { package = "zakura-halo2-gadgets", version = "=5.0.0", default-features = false }
halo2_poseidon = { package = "zakura-halo2-poseidon", version = "=5.0.0" }
halo2_proofs = { package = "zakura-halo2-proofs", version = "=5.0.0", default-features = false }
heck = "0.5.0"
hex = "0.4"
hex-literal = "0.4.1"
indenter = "0.3.3"
indexmap = { version = "2.3.0", default-features = false }
insta = "1.41.1"
itertools = { version = "0.13.0", default-features = false }
itertools012 = { package = "itertools", version = "0.12" }
k256 = { version = "0.13.3", default-features = false }
lean-stwo-dummy = { path = "packages/zk/vendor/lean-stwo-dummy", default-features = false }
leb128 = "0.2"
nam-wasm-instrument = { git = "https://github.com/permissionlessweb/nam-wasm-instrument", rev = "fa6735f54d543326faa2e8ae58119e97be9e11bc" }
num-bigint = { version = "0.4.2", default-features = false }
num-traits = "0.2.18"
owo-colors = "4.0.0"
p256 = { version = "0.13.2", default-features = false }
pasta_curves = { package = "zakura-pasta-curves", version = "=5.0.0" }
paste = "1.0.15"
poseidon377 = { version = "1.2.0", default-features = false }
predicates = "3"
pretty_assertions = "1.4.0"
proc-macro2 = "1"
proptest = { version = "1.5.0", default-features = false }
quote = "1"
rand = "0.8"
rand_chacha_010 = { package = "rand_chacha", version = "0.10" }
rand_core = "0.6"
rayon = "1.9.0"
reddsa = { package = "zakura-reddsa", version = "=5.0.0", default-features = false }
rmp-serde = "1.3.0"
schemars = "0.8.4"
schemars1 = { package = "schemars", version = "1.0.4" }
semver = "1"
serde = { version = "1.0.192", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.140"
serde_with = { version = "3.17.0", default-features = false }
sha2 = "0.10"
sha3 = "0.10"
siphasher = { version = "1.0.1", default-features = false }
static_assertions = "1.1.0"
strum = { version = "0.26.2", default-features = false }
stwo = { package = "stwo", git = "https://github.com/starkware-libs/stwo", rev = "826591c6c371376810ca8213b5812d5daf6d5092", default-features = false }
stwo-constraint-framework = { package = "stwo-constraint-framework", git = "https://github.com/starkware-libs/stwo", rev = "826591c6c371376810ca8213b5812d5daf6d5092", default-features = false }
syn = "2"
target-lexicon = "0.12"
tempfile = "3.1.0"
thiserror = "1.0.26"
time = "0.3.35"
tracing = "0.1.38"
tracing-profile = "0.10.11"
tracing-subscriber = "0.3.18"
typeid = "1.0.3"
wasm-encoder = "0.205.0"
wasmer = { version = "=7.5.0", default-features = false }
wasmer-middlewares = "=7.5.0"
wasmer-types = "=7.5.0"
wat = "1.0"
zk-cosmwasm = { path = "packages/zk", default-features = false }

# Local merge a960b174: upstream zakura-core/common main plus the artifact codec.
# Not pushed. A git rev of the fork tip 798a317 is still 1.3.0-alpha.1 and
# does not contain that merge. Version line is 5.0.0.
[patch.crates-io]
zakura-halo2-gadgets = { path = "../zakura-common/crates/halo2_gadgets" }
zakura-halo2-poseidon = { path = "../zakura-common/crates/halo2_poseidon" }
zakura-halo2-proofs = { path = "../zakura-common/crates/halo2_proofs" }
zakura-pasta-curves = { path = "../zakura-common/crates/pasta_curves" }
zakura-reddsa = { path = "../zakura-common/crates/reddsa" }
wasmer-compiler-singlepass = { git = "https://github.com/permissionlessweb/wasmer", rev = "e1edbf4ff55b0e0ccb61015ee1015d8283689fd5" }
