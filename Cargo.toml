[workspace]
members = ["packages/*"]
exclude = ["contracts"]

resolver = "2"

[workspace.package]
version = "3.0.3-dev"

[workspace.dependencies]
cosmwasm-core = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-crypto = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-derive = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-schema = { path = "../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-schema-derive = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-std = { path = "../ZK/cw/zk-cosmwasm/packages/std" }
cosmwasm-vm = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
zk-cosmwasm = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-vm-derive = { path = "./packages/vm-derive" }
cw-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-schema-derive = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
schemars = "0.8.4"
serde = { version = "1.0.192", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.140"
thiserror = "1.0.26"

zk-test-press = { git = "https://github.com/hard-nett/airdrop", branch = "zk-mvp" }