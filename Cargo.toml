[workspace]
members = ["packages/*", "packages/zk/vendor/lean-stwo-dummy"]
exclude = ["contracts", "packages/zk-vote-bridge"]

resolver = "2"

[workspace.package]
version = "4.0.0-zk"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0"
repository = "https://github.com/permissionlessweb/cosmwasm"

[workspace.dependencies]
cosmwasm-core = { path = "packages/core" }
cosmwasm-crypto = { path = "packages/crypto" }
cosmwasm-derive = { path = "packages/derive" }
cosmwasm-schema = { path = "packages/schema" }
cosmwasm-schema-derive = { path = "packages/schema-derive" }
cosmwasm-std = { path = "packages/std", default-features = false }
cosmwasm-vm = { path = "packages/vm" }
cosmwasm-vm-derive = { path = "packages/vm-derive" }
cw-schema = { path = "packages/cw-schema" }
cw-schema-derive = { path = "packages/cw-schema-derive" }
cosmwasm-check = { path = "packages/check" }
schemars = "0.8.4"
serde = { version = "1.0.192", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.140"
thiserror = "1.0.26"
zk-cosmwasm = { path = "packages/zk" }

# Pushed permissionlessweb/common feat/plonk-artifact-codec (1.3.0-alpha.1).
# The local merge a960b174 is workspace 5.0.0 and does not satisfy =1.3.0-alpha.1.
[patch.crates-io]
zakura-halo2-gadgets = { git = "https://github.com/permissionlessweb/common", rev = "798a3178a6d20d2df08cfe7141065bfb59e4c7a2" }
zakura-halo2-poseidon = { git = "https://github.com/permissionlessweb/common", rev = "798a3178a6d20d2df08cfe7141065bfb59e4c7a2" }
zakura-halo2-proofs = { git = "https://github.com/permissionlessweb/common", rev = "798a3178a6d20d2df08cfe7141065bfb59e4c7a2" }
zakura-pasta-curves = { git = "https://github.com/permissionlessweb/common", rev = "798a3178a6d20d2df08cfe7141065bfb59e4c7a2" }
zakura-reddsa = { git = "https://github.com/permissionlessweb/common", rev = "798a3178a6d20d2df08cfe7141065bfb59e4c7a2" }
wasmer-compiler-singlepass = { git = "https://github.com/permissionlessweb/wasmer", rev = "e1edbf4ff55b0e0ccb61015ee1015d8283689fd5" }