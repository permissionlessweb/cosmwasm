[package]
name = "zk-cosmwasm"
version = { workspace = true }
authors = [""]
edition = "2021"
description = "Zk-Circuit VM bindings to run cosmwams contracts"
repository = "https://github.com/CosmWasm/cosmwasm/tree/main/packages/zk-cosmwasm"
license = "Apache-2.0"

[package.metadata.release]
pre-release-hook = []
pre-release-replacements = []

[lib]
bench = false

[features]
default = ["zk-tests"]
interface = []
zk-tests = []

[dependencies]
base64 = "0.22"
# Uses the path when built locally; uses the given version from crates.io when published
cosmwasm-vm-derive = { workspace = true }
group = "0.13.0"
hex = "0.4"
pasta_curves = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = "1.0.140"
thiserror = "1.0.26"
# We pin wasmer to a specific version because the layout of cached modules can change between patch versions.
wasmer = { version = "=5.0.6", default-features = false, features = ["singlepass"] }
wasmer-middlewares = "=5.0.6"
wasmer-types = "=5.0.6"
 
halo2_gadgets = { path = "../../../zcash/halo2/halo2_gadgets", default-features = false, features = ["test-dependencies"] }
halo2_proofs = { package = "halo2_proofs", path = "../../../zcash/halo2/halo2_proofs" }

# for dev environment
# halo2_proofs  = { path = "../../../../halo2/halo2_proofs", package = "halo2_proofs" }
# halo2_gadgets = { path = "../../../../halo2/halo2_gadgets", default-features = false ,features = ["test-dependencies"]  } 

[dev-dependencies]
clap = "4"
criterion = { version = "0.5.1", features = ["html_reports"] }
glob = "0.3.1"
hex-literal = "0.4.1"
leb128 = "0.2"
rand = "0.8"
target-lexicon = "0.12"
tempfile = "3.1.0"
time = { version = "0.3.35", features = ["formatting"] }
wasm-encoder = "0.205.0"
wat = "1.0"

[profile.release]
debug = 1
