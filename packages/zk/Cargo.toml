[package]
name = "zk-cosmwasm"
version = { workspace = true }
authors = [""]
edition = "2021"
description = "Zk-Circuit VM bindings to run cosmwams contracts"
repository = "https://github.com/CosmWasm/cosmwasm/tree/main/packages/zk-cosmwasm"
license = "Apache-2.0"

[package.metadata.release]
pre-release-hook = []
pre-release-replacements = []

[lib]
bench = false

[[bin]]
name = "verify_gas_calibrate"
path = "src/bin/verify_gas_calibrate.rs"
required-features = ["bn254"]

[features]
default = ["zk-tests"]
interface = []
zk-tests = []
# Enable BN254 curve support in the ZkCurve trait + AnyVerifyingKey dispatch.
# ark-groth16 0.5 + ark-bn254 0.5 (host verify; Phase B).
bn254 = [
    "dep:ark-bn254",
    "dep:ark-groth16",
    "dep:ark-ff",
    "dep:ark-ec",
    "dep:ark-serialize",
    "dep:ark-crypto-primitives",
    "dep:ark-relations",
    "dep:ark-std",
]
# Optional GPU verify backend (CPU-golden accept/reject; CPU fallback).
# Default OFF — no accelerator deps until G2 wires them under this feature only.
# See docs/research/gpu-accel/DESIGN-G1-verifier-backend.md
gpu = []
# Axiom Halo2 KZG / SHPLONK on BN256 (curve_id 6; e.g. zkjwt passkey).
# Default OFF — pulls halo2-axiom + halo2-base; host-side only, do not enable
# for CosmWasm guest wasm32 builds (axiom enables multicore via halo2-base).
# halo2_proofs/multicore keeps PSE batch.rs in sync with maybe-rayon/threads,
# which halo2-base turns on transitively (mixed on/off fails to compile).
halo2-kzg = ["dep:halo2-axiom", "dep:halo2-base", "halo2_proofs/multicore"]

[dependencies]
ark-bn254 = { workspace = true, optional = true, features = ["curve"] }
# SNARK trait lives here in arkworks 0.5 (used by ark-groth16).
ark-crypto-primitives = { workspace = true, optional = true, features = ["snark"] }
ark-ec = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
ark-groth16 = { workspace = true, optional = true }
ark-relations = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
ark-std = { workspace = true, optional = true }
base64 = { workspace = true }
blake3 = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive"] }
# Uses the path when built locally; uses the given version from crates.io when published
cosmwasm-vm-derive = { workspace = true }
group = { workspace = true }
# Axiom KZG backend for `halo2-kzg` (curve_id 6). Same wasm32 rule as above:
# no multicore — host-side verify only.
halo2-axiom = { workspace = true, optional = true, features = ["batch", "circuit-params"] }
halo2-base = { workspace = true, optional = true, features = ["halo2-axiom"] }
# Guest wasm: never enable halo2_proofs default (batch+multicore) — multicore breaks wasm32.
halo2_gadgets = { workspace = true }
halo2_proofs = { workspace = true, features = ["batch"] }
hex = { workspace = true }
pasta_curves = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Host-only: wasmer is for local circuit VM tooling, not for CosmWasm guest builds.
# Target-gate so `cw-headstash` can compile to wasm32 (BridgeMintNote / ict_local_funded).
# Pin versions: wasmer module layout can change between patch versions.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { workspace = true, features = ["singlepass"] }
wasmer-middlewares = { workspace = true }
wasmer-types = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
glob = { workspace = true }
hex-literal = { workspace = true }
leb128 = { workspace = true }
rand = { workspace = true }
target-lexicon = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["formatting"] }
wasm-encoder = { workspace = true }
wat = { workspace = true }

[[bench]]
name = "verify_gas"
harness = false
required-features = ["bn254"]

[profile.release]
debug = 1
