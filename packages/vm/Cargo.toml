[package]
name = "cosmwasm-vm"
version = { workspace = true }
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
description = "VM bindings to run CosmWasm contracts"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
# Wasmer 7.5.0 needs rustc 1.96+.
rust-version = "1.96"

[package.metadata.optimizer]
standard-build = true
builds = [{ name = "cosmwasm-vm", default-features = true }]

[lib]
# See https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
bench = false

[features]
default = [
    "iterator",
    "staking",
    "zk",
    "bn254",
    "hash-blake",
    "hash-poseidon",
    "redpallas",
]
# iterator allows us to iterate over all DB items in a given range
# this must be enabled to support CosmWasm contracts compiled with the 'iterator' feature
# optional as some merkle stores (like tries) don't support this
# given Ethereum 1.0, 2.0, Substrate, and other major projects use Tries
# we keep this optional, to allow possible future integration (or different Cosmos Backends)
iterator = ["cosmwasm-std/iterator"]
staking = ["cosmwasm-std/staking"]
# this enables all stargate-related functionality, including the ibc entry points
stargate = ["cosmwasm-std/stargate"]
# For heap profiling. Only used in the "heap_profiling" example.
dhat-heap = ["dep:dhat"]
# ibc2 enables ibc2-dependent messages, entrypoints and queries
ibc2 = ["cosmwasm-std/ibc2"]
zk = ["cosmwasm-std/zk", "dep:zk-cosmwasm"]
bn254 = ["cosmwasm-crypto/bn254", "zk-cosmwasm?/bn254"]
halo2-kzg = ["zk-cosmwasm?/halo2-kzg"]
hash-blake = ["cosmwasm-crypto/hash-blake"]
hash-poseidon = ["cosmwasm-crypto/hash-poseidon", "dep:poseidon377"]
redpallas = ["cosmwasm-crypto/redpallas"]
# See docs/research/gpu-accel/DESIGN-G1-verifier-backend.md
gpu = ["zk-cosmwasm?/gpu"]

[dependencies]
bech32 = { workspace = true }
blake2 = { workspace = true, default-features = true }
blake3 = { workspace = true, default-features = true }
clru = { workspace = true }
corez = { workspace = true }
cosmwasm-core = { workspace = true }
cosmwasm-crypto = { workspace = true }
cosmwasm-std = { workspace = true, features = ["std"] }
cosmwasm-vm-derive = { workspace = true }
crc32fast = { workspace = true }
# derive_more 1's Debug derive emits ::derive_more::. std uses workspace
# derive_more 2 under that crate name, so vm keeps 1.0.0 directly.
derive_more = { version = "1.0.0", default-features = false, features = ["debug"] }
# For heap profiling. Only used in the "heap_profiling" example. This has to be a non-dev dependency
# because cargo currently does not support optional dev-dependencies.
dhat = { workspace = true, optional = true }

halo2_proofs = { workspace = true, features = ["batch"] }
hex = { workspace = true }
nam-wasm-instrument = { workspace = true, features = ["sign_ext", "bulk", "simd"] }
poseidon377 = { workspace = true, optional = true, features = ["arkworks"] }
rand = { workspace = true }
rand_chacha_010 = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

tracing = { workspace = true }
tracing-profile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
wasmer = { workspace = true, features = ["singlepass"] }
wasmer-middlewares = { workspace = true }
wasmer-types = { workspace = true }
zk-cosmwasm = { workspace = true, features = ["interface"], optional = true }

[dev-dependencies]
clap = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
glob = { workspace = true }
hex-literal = { workspace = true }
leb128 = { workspace = true }
rand = { workspace = true }
# Signing only for redpallas host round-trip tests (feature-gated usage).
reddsa = { workspace = true, default-features = true, features = ["std", "pallas-pasta"] }
target-lexicon = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["formatting"] }
wasm-encoder = { workspace = true }
wat = { workspace = true }

[[bench]]
name = "main"
harness = false

[[bench]]
name = "zk_circuit"
harness = false
required-features = ["zk"]

[[example]]
name = "heap_profiling"
path = "examples/heap_profiling.rs"

[profile.release]
debug = 1
