[package]
name = "cosmwasm-crypto"
version = { workspace = true }
authors = ["Mauro Lacy <maurolacy@users.noreply.github.com>"]
description = "Crypto bindings for CosmWasm contracts"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
# See https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
bench = false

[features]
default = ["std", "multi-curve"]
std = []
bn254 = ["dep:ark-bn254", "dep:ark-std"]
hash-blake = ["dep:blake2", "dep:blake2b_simd", "dep:blake3"]
hash-poseidon = [
    "dep:halo2_poseidon",
    "dep:pasta_curves",
    "dep:group",
    "dep:poseidon377",
]
redpallas = ["dep:reddsa", "reddsa/std", "reddsa/pallas-pasta"]
multi-curve = ["bn254", "hash-blake", "hash-poseidon", "redpallas"]

[dependencies]
ark-bls12-381 = { workspace = true }

# Optional multi-curve / hash libraries (feature-gated — default stays light).
# BN254 (EIP-196/197/1108) lives in src/bn254. Optional so a Wasm guest
# does not compile ark-bn254 unless it calls the host.
ark-bn254 = { workspace = true, optional = true, features = ["curve"] }
ark-ec = { workspace = true, default-features = true, features = ["parallel"] }
ark-ff = { workspace = true, default-features = true, features = ["asm", "parallel"] }
ark-serialize = { workspace = true, default-features = true }
ark-std = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
# `std` is runtime AVX2/SSE4.1 detection. Without it the host stays portable
# unless the whole binary was compiled with `target-feature=avx2`.
blake2b_simd = { workspace = true, optional = true, features = ["std"] }
blake3 = { workspace = true, optional = true }
cosmwasm-core = { workspace = true }

# Not directly used but bumps transitive dependency to avoid <RUSTSEC-2024-0344>
curve25519-dalek = { workspace = true }
digest = { workspace = true }
ecdsa = { workspace = true } # Needed for RecoveryId in secp256r1_recover_pubkey, see https://github.com/RustCrypto/elliptic-curves/issues/1215
ed25519-zebra = { workspace = true, features = ["std"] }
# group/ff used by Pasta Poseidon wrappers (also transitive via pasta_curves).
group = { workspace = true, optional = true }
# Zcash / Halo2 Poseidon (P128Pow5T3) over Pasta pallas/vesta base fields.
halo2_poseidon = { workspace = true, optional = true }
k256 = { workspace = true, features = ["ecdsa"] }
# Not directly used, but needed to fix a compilation error
num-bigint = { workspace = true }
num-traits = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
pasta_curves = { workspace = true, optional = true }
# Penumbra Poseidon over BLS12-377 scalar field (decaf377::Fq).
poseidon377 = { workspace = true, optional = true, features = ["arkworks"] }
rand_core = { workspace = true }
rayon = { workspace = true }
# RedPallas (Orchard/Pallas) + RedJubjub (Sapling/Jubjub) via zakura-common reddsa (lib name `reddsa`).
reddsa = { workspace = true, optional = true, features = ["pallas-pasta"] }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ark-bn254 = { workspace = true, features = ["curve"] }
ark-ec = { workspace = true, default-features = true, features = ["parallel"] }
ark-ff = { workspace = true, default-features = true, features = ["asm", "parallel"] }
base64 = { workspace = true }
base64-serde = { workspace = true }
criterion = { workspace = true }
english-numbers = { workspace = true }
glob = { workspace = true }
hex = { workspace = true, features = ["serde"] }
hex-literal = { workspace = true }
rand_chacha_010 = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
# For RedPallas round-trip tests (signing only in tests).
reddsa = { workspace = true, default-features = true, features = ["std", "pallas-pasta"] }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }

[[bench]]
name = "main"
harness = false
required-features = ["std"]
