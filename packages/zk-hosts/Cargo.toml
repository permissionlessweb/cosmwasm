[package]
name = "zk-cosmwasm-hosts"
version = "4.0.0-zk"
edition = "2021"
publish = false
description = "Host-only Stwo/Flock Path A verifiers for zk-cosmwasm. Workspace member so a git rev can name this crate. Stwo stays on lean-stwo-dummy/real-stwo, not a zk-cosmwasm feature."
license = "Apache-2.0"

[dependencies]
zk-cosmwasm = { path = "../zk", default-features = false }
lean-stwo-dummy = { path = "../zk/vendor/lean-stwo-dummy", default-features = false, features = ["real-stwo"] }
flock-core = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
bincode = "1.3"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
