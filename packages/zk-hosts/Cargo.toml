[package]
name = "zk-cosmwasm-hosts"
version = "4.1.0"
edition = "2021"
publish = false
description = "Host-only Stwo/Flock Path A verifiers for zk-cosmwasm. Workspace member so a git rev can name this crate. Stwo stays on lean-stwo-dummy/real-stwo, not a zk-cosmwasm feature."
license = "Apache-2.0"

[dependencies]
bincode = { workspace = true }
blake3 = { workspace = true, default-features = true }
flock-core = { workspace = true }
lean-stwo-dummy = { workspace = true, features = ["real-stwo"] }
serde = { workspace = true, default-features = true, features = ["derive"] }
sha2 = { workspace = true }
zk-cosmwasm = { workspace = true }
